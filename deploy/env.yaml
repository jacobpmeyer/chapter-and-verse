# Non-secret settings for the Cloud Run service and job (secrets come from
# Secret Manager; see config.sh). Quality and spend settings are explicit here
# rather than left to code defaults. Values must be strings.
LIBRARY_PATH: /library
JOB_RUNNER: cloud_run
INDEXING_JOB: projects/chapter-and-verse-510420/locations/us-east1/jobs/cv-index

SUMMARY_MODEL: claude-sonnet-5-5
SUMMARY_EFFORT: medium
AGENT_MODEL: claude-opus-5-5
AGENT_EFFORT: high
AGENT_MAX_TURNS: "12"
AGENT_THINKING_DISPLAY: summarized

EMBED_PROVIDER: voyage
EMBED_MODEL: voyage-4-large
EMBED_DIM: "1024"

FULL_BOOK_TOKEN_LIMIT: "150000"
WEAK_MATCH_THRESHOLD: "0.2"

DAILY_BUDGET_USD: "5"
DB_POOL_MAX: "4"   # x 2 instances + jobs + admin stays under db-f1-micro's ~25 connections

# Cloudflare Access (from deploy/cloudflare.py): every request except /health must
# carry a valid Access JWT for this application.
CF_ACCESS_TEAM_DOMAIN: jacobpm.cloudflareaccess.com
